name: Bug report
description: Report a bug in DSH Remote Web Gateway
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Before submitting, remove any tokens, cookies, OAuth credentials, personal emails, and private URLs.**
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11 23H2
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: e.g. 0.1.0-rc.5
    validations:
      required: true
  - type: input
    id: gateway-version
    attributes:
      label: Gateway version / commit
      description: e.g. v0.1.0-rc, or the git commit hash
      placeholder: e.g. ba483b4
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser (remote client)
      placeholder: e.g. Chrome 126 / Safari 17
  - type: input
    id: tunnel
    attributes:
      label: Tunnel / access mode
      description: e.g. Cloudflare Quick Tunnel (the default), or which mode you used
      placeholder: e.g. Cloudflare Quick Tunnel
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
  - type: textarea
    id: actual
    attributes:
      label: Actual result
  - type: textarea
    id: logs
    attributes:
      label: Logs / status
      description: |
        Paste the relevant error text, or the plugin's sanitized diagnostic info from Settings → Remote Control (see docs/TROUBLESHOOTING.md).
        ⚠️ Remove any tokens, cookies, OAuth credentials, personal emails, and private URLs before pasting.
      render: text
